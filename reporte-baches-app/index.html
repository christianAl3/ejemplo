<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a1a">
<title>BacheApp — Reporta tu Bache</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-icon">🕳️</span>
    <div>
      <h1>BacheApp</h1>
      <p class="tagline">Reporta baches, mejora tu comunidad</p>
    </div>
  </div>
</header>

<main>

  <!-- Vista: Reportar -->
  <section id="view-reportar" class="view active">
    <form id="form-reporte">
      <div class="field">
        <label>Foto del bache</label>
        <div class="photo-box">
          <img id="preview-foto" class="hidden" alt="Vista previa">
          <div class="photo-actions">
            <label for="input-foto-camara" class="btn btn-secondary">📷 Tomar foto</label>
            <input type="file" id="input-foto-camara" accept="image/*" capture="environment" class="hidden">
            <label for="input-foto-galeria" class="btn btn-ghost">🖼️ Elegir de galería</label>
            <input type="file" id="input-foto-galeria" accept="image/*" class="hidden">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Ubicación</label>
        <button type="button" id="btn-ubicacion" class="btn btn-secondary">
          <span id="spinner-ubicacion" class="spinner hidden"></span>
          <span id="texto-btn-ubicacion">📍 Obtener mi ubicación</span>
        </button>
        <p id="texto-ubicacion" class="hint">Aún no se ha obtenido la ubicación</p>
      </div>

      <div class="field">
        <label for="input-descripcion">Descripción</label>
        <textarea id="input-descripcion" rows="3" placeholder="Ej. Bache grande en el carril derecho, cerca de la esquina..."></textarea>
      </div>

      <div class="field">
        <label>Gravedad</label>
        <div class="severidad-selector" id="severidad-selector">
          <button type="button" class="chip chip-leve" data-valor="leve">🟢 Leve</button>
          <button type="button" class="chip chip-moderado active" data-valor="moderado">🟠 Moderado</button>
          <button type="button" class="chip chip-grave" data-valor="grave">🔴 Grave</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Guardar reporte</button>
      <p id="msg-error" class="error hidden"></p>
    </form>
  </section>

  <!-- Vista: Lista / Dashboard -->
  <section id="view-lista" class="view">
    <div class="stats-row" id="stats-row"></div>

    <div class="toolbar">
      <select id="filtro-severidad">
        <option value="todos">Todas las gravedades</option>
        <option value="leve">🟢 Leve</option>
        <option value="moderado">🟠 Moderado</option>
        <option value="grave">🔴 Grave</option>
      </select>
      <select id="orden-reportes">
        <option value="recientes">Más recientes</option>
        <option value="antiguos">Más antiguos</option>
        <option value="graves">Gravedad</option>
      </select>
      <button id="btn-exportar" class="btn btn-ghost btn-small" title="Descargar reportes en JSON">⬇️ Exportar</button>
    </div>

    <div id="lista-reportes"></div>
    <div id="lista-vacia" class="empty-state hidden">
      <div class="empty-icon">🛣️</div>
      <p>Todavía no hay reportes guardados.</p>
      <p class="hint">Ve a la pestaña "Reportar" para crear el primero.</p>
    </div>
  </section>

  <!-- Vista: Mapa -->
  <section id="view-mapa" class="view">
    <div id="map"></div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="view-reportar">
    <span class="nav-icon">➕</span><span>Reportar</span>
  </button>
  <button class="nav-btn" data-view="view-lista">
    <span class="nav-icon">📋</span><span>Reportes</span>
  </button>
  <button class="nav-btn" data-view="view-mapa">
    <span class="nav-icon">🗺️</span><span>Mapa</span>
  </button>
</nav>

<div id="toast-container"></div>

<div id="modal-confirmar" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modal-mensaje">¿Eliminar este reporte?</p>
    <div class="modal-actions">
      <button id="modal-cancelar" class="btn btn-ghost">Cancelar</button>
      <button id="modal-confirmar-btn" class="btn btn-danger">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
